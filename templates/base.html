<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library System - Lab 4</title>
    <style>
        body { font-family: Segoe UI, sans-serif; margin: 0; padding: 25px; background: #f8fafc; color: #1e293b; }
        nav { background: #1e293b; padding: 15px 20px; border-radius: 8px; margin-bottom: 25px; }
        nav a { color: #f8fafc; text-decoration: none; margin-right: 20px; font-weight: 600; font-size: 14px; }
        nav a:hover { color: #818cf8; }
        .container { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; margin-bottom: 25px; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; font-size: 14px; }
        th { background-color: #f1f5f9; color: #475569; text-transform: uppercase; font-size: 12px; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: 600; display: inline-block; width: 130px; }
        input, select { padding: 8px 12px; width: 260px; border: 1px solid #cbd5e1; border-radius: 6px; }
        button { background: #4f46e5; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        button:hover { background: #4338ca; }
    </style>
</head>
<body>
    <nav>
        <a href="/search">🔍 Search</a>
        <a href="/catalogue">📚 Catalogue</a>
        <a href="/reports">📊 Reports</a>
        <a href="/loans">📋 Loans</a>
        <a href="/analytics">⭐ Most Borrowed</a>
        <a href="/authors">✍️ Authors & Books</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
